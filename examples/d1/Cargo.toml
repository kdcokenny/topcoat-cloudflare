[package]
name = "f4y-example"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
topcoat-cloudflare = "=0.1.0"
wasm-bindgen = "0.2"

[dependencies.topcoat]
version = "=0.9.0"
default-features = false
features = ["router", "view", "asset", "runtime", "discover", "font-fontsource", "icon"]

[dependencies.toasty]
git = "https://github.com/Sillyvan/toasty"
rev = "ebd27dbfc385fbd7a673ef8ab664db4890087863"
default-features = false
features = ["jiff"]

[dependencies.jiff]
version = "=0.2.37"
features = ["js"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.worker]
version = "=0.8.7"
features = ["http", "d1"]

[dependencies.topcoat-icon-macro]
version = "=0.9.0"
features = ["iconify"]

[dependencies.toasty-driver-d1]
git = "https://github.com/Sillyvan/toasty"
rev = "ebd27dbfc385fbd7a673ef8ab664db4890087863"
features = ["jiff"]

[dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[build-dependencies.topcoat]
version = "=0.9.0"
default-features = false
features = ["tailwind", "icon-iconify"]

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]
