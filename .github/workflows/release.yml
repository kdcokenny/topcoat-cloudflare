name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release tag
        run: |
          version=$(jq -r .version packages/adapter/package.json)
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "Run this workflow from the v$version tag."
            exit 1
          fi

  verify:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  publish-crate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p topcoat-cloudflare --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    needs: publish-crate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: artifacts/release
      - run: npm publish artifacts/release/*.tgz --access public

  verify-installation:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Wait for npm availability
        timeout-minutes: 10
        run: |
          package=$(jq -r '.npmPackage + "@" + .version' artifacts.json)
          registry_poll_interval=10
          until npm view "$package" version --prefer-online; do
            sleep "$registry_poll_interval"
          done
      - run: node consumer.ts . --registry
        env:
          TOPCOAT_CONSUMER_ISOLATED: '1'
          WRANGLER_SEND_METRICS: 'false'
