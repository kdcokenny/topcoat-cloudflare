[workspace]
resolver = "2"
members = [
  "crates/topcoat-cloudflare",
  "crates/topcoat-cloudflare-build",
  "examples/starter",
  "tests/fixture",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/kdcokenny/topcoat-cloudflare"

[workspace.dependencies]
topcoat = { version = "=0.9.0", default-features = false }
topcoat-asset = { version = "=0.9.0", default-features = false }
topcoat-cloudflare = { path = "crates/topcoat-cloudflare" }
worker = { version = "=0.8.7", features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[profile.dev.package."*"]
debug = false
